name: Build Geode Mod

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
          - name: Android64
            os: ubuntu-latest
            target: Android64
          # Uncomment if you also want 32-bit Android builds too
          # (both android32 and android64 share the same "android" key in mod.json,
          # so no mod.json change is needed to add this)
          # - name: Android32
          #   os: ubuntu-latest
          #   target: Android32

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # ubuntu-latest's preinstalled CMake is too old for one of the mod's
      # transitive deps (matjson's msgpack backend needs CMake >= 4.1).
      # windows-latest already ships a new enough CMake, so this only runs on Linux.
      #
      # NOTE: we deliberately overwrite the cmake binary already first on PATH,
      # rather than prepending a new one, since geode-sdk/build-geode-mod resolves
      # `cmake` in a way that a simple PATH-prepend (e.g. via a marketplace
      # cmake-setup action) does not override.
      - name: Upgrade CMake in-place (Linux runners only)
        if: runner.os == 'Linux'
        run: |
          set -e
          CMAKE_BIN="$(command -v cmake)"
          CMAKE_DIR="$(dirname "$CMAKE_BIN")"
          echo "Existing cmake: $CMAKE_BIN ($(cmake --version | head -n1))"

          LATEST=$(curl -fsSL https://api.github.com/repos/Kitware/CMake/releases/latest \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['tag_name'].lstrip('v'))")
          echo "Installing CMake $LATEST"

          curl -fsSL -o /tmp/cmake.tar.gz \
            "https://github.com/Kitware/CMake/releases/download/v${LATEST}/cmake-${LATEST}-linux-x86_64.tar.gz"
          sudo mkdir -p /opt/cmake-new
          sudo tar -xzf /tmp/cmake.tar.gz -C /opt/cmake-new --strip-components=1

          # Overwrite the binaries at the exact path already first on PATH,
          # so every caller resolving "cmake" (however it does so) gets the new one.
          # (CMake resolves its own share/Modules dir via /proc/self/exe, i.e. the
          # real target of the symlink, so this doesn't need the old share/ dir touched.)
          sudo ln -sf /opt/cmake-new/bin/cmake "$CMAKE_DIR/cmake"
          sudo ln -sf /opt/cmake-new/bin/ctest "$CMAKE_DIR/ctest"
          sudo ln -sf /opt/cmake-new/bin/cpack "$CMAKE_DIR/cpack"

          hash -r
          echo "Now: $(command -v cmake) ($(cmake --version | head -n1))"

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          target: ${{ matrix.config.target }}

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ['build']
    steps:
      - uses: geode-sdk/build-geode-mod@combine
        id: build

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.build-output-name }}
          path: ${{ steps.build.outputs.build-output }}
