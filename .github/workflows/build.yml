name: Build Geode Mod

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
          - name: Android64
            os: ubuntu-latest
            target: Android64
          # Uncomment if you also want 32-bit Android builds too
          # (both android32 and android64 share the same "android" key in mod.json,
          # so no mod.json change is needed to add this)
          # - name: Android32
          #   os: ubuntu-latest
          #   target: Android32

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # ubuntu-latest's preinstalled CMake is too old for one of the mod's
      # transitive deps (matjson's msgpack backend needs CMake >= 4.1).
      # windows-latest already ships a new enough CMake, so this only runs on Linux.
      - name: Upgrade CMake (Linux runners only)
        if: runner.os == 'Linux'
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: 'latest'

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          target: ${{ matrix.config.target }}

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ['build']
    steps:
      - uses: geode-sdk/build-geode-mod@combine
        id: build

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.build-output-name }}
          path: ${{ steps.build.outputs.build-output }}
